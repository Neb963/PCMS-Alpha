<div class="page" data-view="generators" id="page"><header class="page-head"><div><h1 class="page-title" id="page-heading" tabindex="-1">Generators</h1><p class="page-subtitle">Browse and manage your generators.</p></div><div class="head-actions"><button class="btn" data-action="sync-inventory" type="button"><svg aria-hidden="true" class=""><use href="#i-refresh"></use></svg> Sync inventory</button><button class="btn" data-action="creation-batches" type="button">Batch progress</button><button class="btn primary" data-action="create" type="button"><svg aria-hidden="true" class=""><use href="#i-plus"></use></svg> Create generators</button></div></header>
<div class="card workspace-surface"><div style="padding:18px 18px 0"><div class="toolbar"><label class="searchbox"><svg aria-hidden="true" class=""><use href="#i-search"></use></svg><input aria-label="Search generators" autocomplete="off" id="generator-search" placeholder="Search generators or accounts…" type="search" value=""/></label><div class="filter-controls"><select aria-label="Filter by account" class="select" id="generator-account"><option value="ALL">All accounts</option></select><select aria-label="Sort generators" class="select" id="generator-sort"><option value="fleet">Fleet order</option><option value="name">Name A–Z</option><option value="account">Account</option></select><button class="btn small" aria-expanded="false" data-action="generator-filters" type="button"><svg aria-hidden="true" class=""><use href="#i-filter"></use></svg> More filters</button></div></div>

<div class="toolbar" data-generator-selection hidden><span data-selection-count></span><div class="filter-controls"><button class="btn small" data-action="review-generator-selection" type="button">Review selection</button><button class="btn small" data-action="clear-generator-selection" type="button">Clear</button></div><p class="setting-note" data-selection-error hidden role="status"></p></div><div aria-label="Generator status" class="tabs" role="tablist"><button aria-controls="ui-tab-region-0" aria-selected="true" class="tab" data-filter="generators:ALL" role="tab" tabindex="0">All<span class="count">—</span></button><button aria-controls="ui-tab-region-0" aria-selected="false" class="tab" data-filter="generators:PUBLISHED" role="tab" tabindex="-1">Published<span class="count">—</span></button><button aria-controls="ui-tab-region-0" aria-selected="false" class="tab" data-filter="generators:DEVELOPING" role="tab" tabindex="-1">Developing<span class="count">—</span></button><button aria-controls="ui-tab-region-0" aria-selected="false" class="tab" data-filter="generators:REVIEW" role="tab" tabindex="-1">Needs review<span class="count">—</span></button><button aria-controls="ui-tab-region-0" aria-selected="false" class="tab" data-filter="generators:HELD" role="tab" tabindex="-1">Held<span class="count">—</span></button></div></div>

name: PCMS Required
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcms-required-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout signed Stage 7 authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signed Stage 7 documentation
        run: python3 scripts/check-stage7.py
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public vendored donor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Configure Node 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Draft-only changed-file preflight (not product acceptance)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        run: node scripts/draft-preflight.mjs
      - name: Independently verify all 223 original donor files and Git tree
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node scripts/verify-donor.mjs
      - name: Fast I00 and CI adversarial tests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node --test tests/i00-*.test.mjs
      - name: Pinned donor regression suite
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: |
          set -euo pipefail
          # Donor repository test uses git ls-files relative to its own root.
          # Isolate a synthetic index solely for donor tests; source bytes are verified before copying.
          testdir="$(mktemp -d)"
          trap 'rm -rf "$testdir"' EXIT
          cp -a donor/personamonkey "$testdir/personamonkey"
          git -C "$testdir/personamonkey" init --quiet
          git -C "$testdir/personamonkey" add -N .
          npm --prefix "$testdir/personamonkey" test
      - name: Assemble combined XPI
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: node scripts/build-i00.mjs
      - name: Verify XPI reproducibility
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: |
          sha256sum build/pcms-alpha-i00.xpi | tee build/xpi-first.sha256
          node scripts/build-i00.mjs
          sha256sum build/pcms-alpha-i00.xpi | tee build/xpi-second.sha256
          cmp build/xpi-first.sha256 build/xpi-second.sha256
      - name: Upload exact combined XPI
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcms-alpha-i00-xpi
          path: build/pcms-alpha-i00.xpi
          if-no-files-found: error
          retention-days: 14
      - name: Independently audit exact XPI and donor-only native bridge
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 scripts/a08-xpi-audit.py build/pcms-alpha-i00.xpi
      - name: A08 independent adverse XPI mutation controls
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 scripts/a08-xpi-negative.py build/pcms-alpha-i00.xpi
  firefox:
    name: firefox
    needs: fast
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout browser harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download same-run packaged XPI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pcms-alpha-i00-xpi
          path: build
      - name: Install exact Firefox Developer Edition and driver
        run: bash scripts/setup-firefox.sh
      # A02 client amendment replaces native/Secret-Service backup acceptance.
      # The installed-XPI Firefox B suite now exercises browser-native manual
      # export, streamed restore staging and independent disposable file reopen.
      # Historical S02 host/crypto regression source remains in repository,
      # but is not a new operator/runtime product prerequisite.
      - name: Persistent Firefox donor-to-PCMS upgrade and source-state survival
        run: python3 scripts/a08-upgrade-firefox.py build/pcms-alpha-i00.xpi
      - name: Persistent installed-XPI Firefox B smoke
        run: python3 scripts/browser-i00-smoke.py build/pcms-alpha-i00.xpi
      - name: Preserve redacted operator UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcms-journey-ui
          path: |
            build/j01-*.png
            build/j01-ui-evidence.json
            build/j02-*.png
            build/j02-ui-evidence.json
            build/j03-*.png
            build/j03-ui-evidence.json
            build/j04-*.png
            build/j04-*.json
            build/j05-*.png
            build/j05-*.json
            build/j06-*.png
            build/j06-*.json
            build/j07-*.png
            build/issue60-*.png
            build/issue60-ui-evidence.json
            build/j07-*.json
            build/j07-final-audit.md
          if-no-files-found: ignore
          retention-days: 14
  pcms-required:
    # A draft must never publish the protected full-acceptance context.
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == true) && 'pcms-draft-preflight' || 'pcms-required' }}
    if: ${{ always() }}
    needs: [baseline, fast, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout main-trusted full aggregate
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # Never execute the candidate's changed gate to accept that candidate.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - name: Evaluate every mandatory child result with main-trusted policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          FIREFOX_RESULT: ${{ needs.firefox.result }}
        run: node scripts/verify-required.mjs "{\"baseline\":\"${BASELINE_RESULT}\",\"fast\":\"${FAST_RESULT}\",\"firefox\":\"${FIREFOX_RESULT}\"}"
      - name: Evaluate draft feedback only
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          FIREFOX_RESULT: ${{ needs.firefox.result }}
        run: |
          node -e 'if(process.env.BASELINE_RESULT!=="success" || process.env.FAST_RESULT!=="success" || process.env.FIREFOX_RESULT!=="skipped")process.exit(1); console.log("DRAFT_PREFLIGHT_ONLY: not full acceptance and not pcms-required")'

name: PCMS Required
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcms-required-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout signed Stage 7 authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signed Stage 7 documentation
        run: python3 scripts/check-stage7.py
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public vendored donor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure Node 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Independently verify all 223 original donor files and Git tree
        run: node scripts/verify-donor.mjs
      - name: Fast I00 and CI adversarial tests
        run: node --test tests/i00-*.test.mjs
      - name: Pinned donor regression suite
        run: |
          set -euo pipefail
          # Donor repository test uses git ls-files relative to its own root.
          # Isolate a synthetic index solely for donor tests; source bytes are verified before copying.
          testdir="$(mktemp -d)"
          trap 'rm -rf "$testdir"' EXIT
          cp -a donor/personamonkey "$testdir/personamonkey"
          git -C "$testdir/personamonkey" init --quiet
          git -C "$testdir/personamonkey" add -N .
          npm --prefix "$testdir/personamonkey" test
      - name: Assemble combined XPI
        run: node scripts/build-i00.mjs
      - name: Verify XPI reproducibility
        run: |
          sha256sum build/pcms-alpha-i00.xpi | tee build/xpi-first.sha256
          node scripts/build-i00.mjs
          sha256sum build/pcms-alpha-i00.xpi | tee build/xpi-second.sha256
          cmp build/xpi-first.sha256 build/xpi-second.sha256
      - name: Upload exact combined XPI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcms-alpha-i00-xpi
          path: build/pcms-alpha-i00.xpi
          if-no-files-found: error
          retention-days: 14
      - name: Build checksum-verified matching operator/native host package
        run: |
          set -euo pipefail
          xpi_before="$(sha256sum build/pcms-alpha-i00.xpi | cut -d' ' -f1)"
          node scripts/build-operator-package.mjs
          test "$xpi_before" = "$(sha256sum build/pcms-alpha-i00.xpi | cut -d' ' -f1)"
          mkdir -p build/operator-repro
          cp build/pcms-alpha-operator.tar.gz build/operator-repro/first.tar.gz
          node scripts/build-operator-package.mjs
          cmp build/operator-repro/first.tar.gz build/pcms-alpha-operator.tar.gz
          tar -xOzf build/pcms-alpha-operator.tar.gz pcms-alpha-operator/pcms-alpha.xpi | cmp - build/pcms-alpha-i00.xpi
          tar -xOzf build/pcms-alpha-operator.tar.gz pcms-alpha-operator/SHA256SUMS |
            grep -F '  pcms-alpha.xpi' | cut -d' ' -f1 | grep -Fx "$xpi_before"
      - name: Upload matching OS native host installer and XPI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcms-alpha-operator-matched
          path: build/pcms-alpha-operator.tar.gz
          if-no-files-found: error
          retention-days: 14
  firefox:
    name: firefox
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout browser harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download same-run packaged XPI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pcms-alpha-i00-xpi
          path: build
      - name: Install exact Firefox Developer Edition and driver
        run: bash scripts/setup-firefox.sh
      # A02 client amendment replaces native/Secret-Service backup acceptance.
      # The installed-XPI Firefox B suite now exercises browser-native manual
      # export, streamed restore staging and independent disposable file reopen.
      # Historical S02 host/crypto regression source remains in repository,
      # but is not a new operator/runtime product prerequisite.
      - name: Persistent installed-XPI Firefox B smoke
        run: python3 scripts/browser-i00-smoke.py build/pcms-alpha-i00.xpi
  pcms-required:
    name: pcms-required
    if: ${{ always() }}
    needs: [baseline, fast, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout fail-closed aggregate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Evaluate every mandatory child result
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          FIREFOX_RESULT: ${{ needs.firefox.result }}
        run: node scripts/verify-required.mjs "{\"baseline\":\"${BASELINE_RESULT}\",\"fast\":\"${FAST_RESULT}\",\"firefox\":\"${FIREFOX_RESULT}\"}"
